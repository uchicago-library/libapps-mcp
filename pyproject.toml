[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uc-libapps-mcp"
version = "0.1.0"
description = "Read-only MCP server for LibGuides sites (Springshare LibApps API v1.2)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "University of Chicago Library" }]
dependencies = [
  "mcp>=2,<3",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "markdownify>=0.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[project.scripts]
uc-libapps-mcp = "uc_libapps_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live: opt-in tests against the real LibApps API (set LIBAPPS_LIVE_TESTS=1)",
]
